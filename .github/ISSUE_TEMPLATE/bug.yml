name: Report a problem / Relatar um problema
description: Something didn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Swipe Clean! The more details, the faster it can be fixed. (Pode escrever em português.)
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Opened the app
        2. Clicked Scan my PC
        3. ...
  - type: input
    id: version
    attributes:
      label: Swipe Clean version
      description: Shown at the bottom of ⚙ Settings.
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: textarea
    id: log
    attributes:
      label: Log
      description: In ⚙ Settings → Open folder, open log.txt and paste its contents here (or drag the file). It contains no passwords, only program and folder names.
      render: text
