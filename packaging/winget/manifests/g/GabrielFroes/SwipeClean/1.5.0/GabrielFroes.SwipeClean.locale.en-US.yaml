ShortDescription: Free up disk space by swiping cards. Games, apps and large folders, one at a time.
Description: |-
  Swipe Clean shows your games, apps and large folders one at a time, biggest first.
  Swipe left to mark something for removal and right to keep it. Steam and Epic games show
  their cover art and when you last played them. Nothing is removed until you review and
  confirm: personal files go to the Recycle Bin and programs use their official uninstaller.
