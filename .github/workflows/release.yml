# Publica uma nova versão do Swipe Clean.
#
# Como usar: aumente "version" no package.json, adicione a seção da versão no CHANGELOG.md
# e envie para a branch main. Se ainda não existir um Release com essa versão, o GitHub
# compila no Windows, cria a tag vX.Y.Z e publica o instalador, a versão portátil e o
# SHA256SUMS.txt (o app confere esse arquivo antes de instalar uma atualização).
# Envios que não mudam a versão não publicam nada.
#
# Doação por Pix: configure os segredos PIX_KEY, PIX_NOME e PIX_CIDADE em
# Settings → Secrets and variables → Actions. Eles entram só no instalador, nunca no código.
# Sem PIX_KEY, a versão é publicada sem o botão de doação.

name: Publicar versão

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-versao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Verificar se esta versão já foi publicada
        id: versao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A versão v$version já está publicada. Nada a fazer."
            "publicar=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Publicando a versão v$version"
            "publicar=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-node@v5
        if: steps.versao.outputs.publicar == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Configurar doação por Pix
        if: steps.versao.outputs.publicar == 'true'
        shell: pwsh
        env:
          PIX_KEY: ${{ secrets.PIX_KEY }}
          PIX_NOME: ${{ secrets.PIX_NOME }}
          PIX_CIDADE: ${{ secrets.PIX_CIDADE }}
        run: |
          $cfg = Get-Content doacao.exemplo.json -Raw | ConvertFrom-Json
          if ($env:PIX_KEY) {
            $cfg.pixKey = $env:PIX_KEY
            $cfg.nome = $env:PIX_NOME
            $cfg.cidade = $env:PIX_CIDADE
            $fim = $env:PIX_KEY.Substring([Math]::Max(0, $env:PIX_KEY.Length - 4))
            Write-Host "::notice::Doação por Pix ativada (chave terminando em $fim)"
          } else {
            Write-Host "::warning::Segredo PIX_KEY não configurado: a versão sai sem o botão de doação"
          }
          $cfg | ConvertTo-Json | Set-Content doacao.json -Encoding utf8NoBOM

      - name: Instalar dependências
        if: steps.versao.outputs.publicar == 'true'
        run: npm ci

      - name: Gerar instalador e versão portátil
        if: steps.versao.outputs.publicar == 'true'
        run: npx electron-builder --win nsis portable --publish never

      - name: Somas SHA-256 (usadas pela atualização automática)
        if: steps.versao.outputs.publicar == 'true'
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -match '^SwipeClean-(Setup|Portable)-.*\.exe$' } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          if (-not $lines) { throw "Nenhum .exe encontrado em dist" }
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist/SHA256SUMS.txt

      - name: Notas da versão a partir do CHANGELOG
        if: steps.versao.outputs.publicar == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Swipe Clean $version" }
          $sums = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          $notes += "`n`n---`n**Which one?** ``SwipeClean-Setup`` installs with Start menu shortcuts. ``SwipeClean-Portable`` runs directly, no installation. · **Qual baixar?** ``Setup`` instala com atalhos; ``Portable`` abre direto, sem instalar.`n`nIf Windows shows ""Windows protected your PC"", click **More info → Run anyway**. · Se aparecer ""O Windows protegeu o computador"", clique em **Mais informações → Executar assim mesmo**.`n`n<details><summary>SHA-256</summary>`n`n```````n$sums`n```````n</details>"
          Set-Content release-notes.md $notes -Encoding utf8NoBOM

      - name: Publicar no GitHub Releases
        if: steps.versao.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Swipe Clean ${{ steps.versao.outputs.tag }}
          make_latest: true
          body_path: release-notes.md
          files: |
            dist/SwipeClean-Setup-*.exe
            dist/SwipeClean-Portable-*.exe
            dist/SHA256SUMS.txt
