ShortDescription: Libere espaço no disco deslizando cartas. Jogos, aplicativos e pastas grandes, um de cada vez.
Description: |-
  O Swipe Clean mostra seus jogos, aplicativos e pastas grandes um de cada vez, do maior para o menor.
  Deslize para a esquerda para marcar para remover e para a direita para manter. Jogos da Steam e da
  Epic aparecem com a capa e a data em que você jogou pela última vez. Nada é removido antes de você
  revisar e confirmar: arquivos pessoais vão para a Lixeira e programas saem pelo desinstalador oficial.
