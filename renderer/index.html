<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swipe Clean</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="assets/icon.png" alt="" /> Swipe Clean</div>
    <div class="disk" id="disk" data-i18n-title="top.diskTitle">
      <div class="disk-text"><span id="diskLabel">Disco</span><span id="diskFree">—</span></div>
      <div class="disk-bar"><div class="disk-used" id="diskUsed"></div><div class="disk-pending" id="diskPending"></div></div>
    </div>
    <button class="pill" id="queuePill" hidden></button>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="top.settings" aria-label="Settings">⚙</button>
  </header>

  <div class="demo-banner" id="demoBanner" data-i18n="app.demoBanner" hidden></div>
  <div class="update-banner" id="updateBanner" hidden>
    <span class="update-dot" aria-hidden="true"></span>
    <span id="updateText"></span>
    <button class="link" id="updateNotes" data-i18n="update.whatsNew"></button>
    <span class="spacer"></span>
    <button class="ghost small" id="updateLater" data-i18n="update.later"></button>
    <button class="primary small" id="updateBtn" data-i18n="update.install"></button>
  </div>

  <main>
    <!-- início -->
    <section class="screen" id="screen-home">
      <div class="hero">
        <div class="hero-cards" aria-hidden="true">
          <div class="hc hc1">✕</div><div class="hc hc2">🎮</div><div class="hc hc3">♥</div>
        </div>
        <h1 data-i18n="home.title"></h1>
        <p class="lead" data-i18n-html="home.lead"></p>
        <button class="primary big" id="startBtn" data-i18n="home.start"></button>
        <div class="admin-note" id="adminNote" hidden>
          <span data-i18n="home.adminNote"></span>
          <button class="ghost small" id="adminBtnHome" data-i18n="home.adminBtn"></button>
        </div>
      </div>
    </section>

    <!-- analisando -->
    <section class="screen" id="screen-scan" hidden>
      <div class="scan">
        <div class="scan-head">
          <div class="radar" aria-hidden="true"><span></span><span></span><span></span><div class="radar-core">🔍</div></div>
          <div>
            <h2 data-i18n="scan.title"></h2>
            <p class="muted"><span id="scanElapsed">0:00</span> · <span data-i18n="scan.hint"></span></p>
          </div>
        </div>
        <div class="bar"><div class="bar-fill" id="scanBar"></div></div>
        <ul class="steps" id="steps"></ul>
        <p class="scan-detail" id="scanDetail">&nbsp;</p>
      </div>
    </section>

    <!-- resumo por categoria -->
    <section class="screen" id="screen-summary" hidden>
      <div class="summary">
        <div class="summary-head">
          <div>
            <h2 id="summaryTitle"></h2>
            <p class="muted" id="summarySub"></p>
          </div>
          <button class="ghost" id="rescanBtn" data-i18n="summary.rescan"></button>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>
    </section>

    <!-- cartas -->
    <section class="screen" id="screen-deck" hidden>
      <div class="deck-head">
        <button class="ghost small" id="toSummary" data-i18n="deck.backSummary"></button>
        <div class="tabs" id="tabs"></div>
        <div class="counter" id="counter"></div>
      </div>

      <div class="stack-wrap">
        <div class="stack" id="stack"></div>
        <div class="deck-empty" id="deckEmpty" hidden>
          <div class="empty-icon">✓</div>
          <h2 id="emptyTitle"></h2>
          <p id="emptyText"></p>
          <div class="row" id="emptyActions"></div>
        </div>
      </div>

      <div class="actions">
        <button class="round no" id="noBtn" data-i18n-title="deck.removeTitle">✕</button>
        <button class="round undo" id="undoBtn" data-i18n-title="deck.undoTitle">↶</button>
        <button class="round yes" id="yesBtn" data-i18n-title="deck.keepTitle">♥</button>
      </div>
      <p class="keys" data-i18n="deck.keys"></p>
    </section>

    <!-- revisão -->
    <section class="screen" id="screen-review" hidden>
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="review.title"></h2>
            <p class="muted" data-i18n="review.sub"></p>
          </div>
          <button class="ghost" id="backToDeck" data-i18n="review.back"></button>
        </div>
        <div class="list" id="reviewList"></div>
        <div class="panel-foot">
          <div class="total" id="reviewTotal"></div>
          <button class="danger" id="confirmBtn" data-i18n="review.remove"></button>
        </div>
      </div>
    </section>

    <!-- removendo / resultado -->
    <section class="screen" id="screen-remove" hidden>
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2 id="removeTitle" data-i18n="remove.title"></h2>
            <p class="muted" id="removeSub" data-i18n="remove.dontClose"></p>
          </div>
          <button class="ghost" id="skipBtn" data-i18n="remove.skip" hidden></button>
        </div>
        <div class="list" id="removeList"></div>
        <div class="donate-strip" id="donateStrip" hidden>
          <div class="donate-heart">♥</div>
          <div class="donate-text"><b id="donateStripTitle" data-i18n="donate.stripTitle"></b><span data-i18n="donate.stripText"></span></div>
          <button class="primary small" id="donateStripBtn" data-i18n="donate.supportBtn"></button>
        </div>
        <div class="panel-foot" id="removeFoot" hidden>
          <div class="total" id="removeTotal"></div>
          <div class="row">
            <button class="ghost" id="backSummaryBtn" data-i18n="remove.continue"></button>
            <button class="primary" id="againBtn" data-i18n="remove.again"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- modal de confirmação -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h3 id="modalTitle" data-i18n="confirm.title"></h3>
      <p id="modalText"></p>
      <div class="row end">
        <button class="ghost" id="modalCancel" data-i18n="confirm.cancel"></button>
        <button class="danger" id="modalOk" data-i18n="confirm.ok"></button>
      </div>
    </div>
  </div>

  <!-- configurações -->
  <div class="modal" id="settings" hidden>
    <div class="modal-box wide">
      <div class="settings-head">
        <h3 data-i18n="settings.title"></h3>
        <button class="icon-btn" id="settingsClose" aria-label="Fechar">✕</button>
      </div>

      <div class="setting">
        <div>
          <b data-i18n="settings.language"></b>
          <span data-i18n="settings.languageHint"></span>
        </div>
        <select id="optLanguage" class="select">
          <option value="auto" data-i18n="settings.languageAuto"></option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="en">English</option>
        </select>
      </div>

      <label class="setting">
        <div>
          <b data-i18n="settings.covers"></b>
          <span data-i18n="settings.coversHint"></span>
        </div>
        <input type="checkbox" class="switch" id="optCovers" />
      </label>

      <label class="setting">
        <div>
          <b data-i18n="settings.showKept"></b>
          <span data-i18n="settings.showKeptHint"></span>
        </div>
        <input type="checkbox" class="switch" id="optShowKept" />
      </label>

      <label class="setting">
        <div>
          <b data-i18n="settings.showSystem"></b>
          <span data-i18n="settings.showSystemHint"></span>
        </div>
        <input type="checkbox" class="switch" id="optShowSystem" />
      </label>

      <div class="setting">
        <div>
          <b data-i18n="settings.kept"></b>
          <span id="keptInfo"></span>
        </div>
        <button class="ghost small" id="clearKeptBtn" data-i18n="settings.forget"></button>
      </div>

      <div class="setting">
        <div>
          <b data-i18n="settings.admin"></b>
          <span id="adminInfo">—</span>
        </div>
        <button class="ghost small" id="adminBtn" data-i18n="settings.adminBtn"></button>
      </div>

      <label class="setting">
        <div>
          <b data-i18n="settings.autoUpdate"></b>
          <span data-i18n="settings.autoUpdateHint"></span>
        </div>
        <input type="checkbox" class="switch" id="optAutoUpdate" />
      </label>

      <div class="setting">
        <div>
          <b data-i18n="settings.updates"></b>
          <span id="updateInfo"></span>
        </div>
        <button class="ghost small" id="checkUpdateBtn" data-i18n="settings.checkNow"></button>
      </div>

      <div class="setting">
        <div>
          <b data-i18n="settings.data"></b>
          <span data-i18n="settings.dataHint"></span>
        </div>
        <button class="ghost small" id="openLogsBtn" data-i18n="settings.openFolder"></button>
      </div>

      <div class="setting" id="donateSetting" hidden>
        <div>
          <b data-i18n="settings.support"></b>
          <span data-i18n="settings.supportHint"></span>
        </div>
        <button class="primary small" id="donateSettingBtn" data-i18n="donate.supportBtn"></button>
      </div>

      <p class="about" id="about">Swipe Clean</p>
    </div>
  </div>

  <!-- doação por Pix -->
  <div class="modal" id="donate" hidden>
    <div class="modal-box donate-box">
      <div class="settings-head">
        <h3 data-i18n="donate.title"></h3>
        <button class="icon-btn" id="donateClose" aria-label="Fechar">✕</button>
      </div>
      <p class="muted donate-lead" data-i18n-html="donate.lead"></p>
      <div class="amounts" id="amounts"></div>
      <div class="donate-main">
        <div class="qr-wrap"><img id="donateQr" alt="QR Code Pix" /></div>
        <div class="donate-side">
          <div class="donate-label" data-i18n="donate.to"></div>
          <div class="donate-name" id="donateName">—</div>
          <div class="donate-label" data-i18n="donate.key"></div>
          <div class="donate-key" id="donateKey">—</div>
          <button class="ghost small" id="copyKeyBtn" data-i18n="donate.copyKey"></button>
          <button class="primary" id="copyCodeBtn" data-i18n="donate.copyCode"></button>
          <span class="copied" id="copied" data-i18n="donate.copied" hidden></span>
        </div>
      </div>
      <p class="donate-foot" data-i18n="donate.foot"></p>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="demo-data.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
