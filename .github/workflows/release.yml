# Publica uma nova versão do Swipe Clean.
#
# Como usar: atualize "version" no package.json e o CHANGELOG.md, faça commit e crie a tag:
#   git tag v1.2.0 && git push origin v1.2.0
# O GitHub compila no Windows e publica o instalador e a versão portátil em "Releases".
#
# Doação por Pix: configure os segredos PIX_KEY, PIX_NOME e PIX_CIDADE em
# Settings → Secrets and variables → Actions. Eles entram só no instalador, nunca no código.
# Sem PIX_KEY, a versão é publicada sem o botão de doação.

name: Publicar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch: # rodar manualmente gera um build de teste, sem publicar

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir se a tag bate com o package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não bate com a versão $version do package.json"
          }

      - name: Configurar doação por Pix
        shell: pwsh
        env:
          PIX_KEY: ${{ secrets.PIX_KEY }}
          PIX_NOME: ${{ secrets.PIX_NOME }}
          PIX_CIDADE: ${{ secrets.PIX_CIDADE }}
        run: |
          $cfg = Get-Content doacao.exemplo.json -Raw | ConvertFrom-Json
          if ($env:PIX_KEY) {
            $cfg.pixKey = $env:PIX_KEY
            $cfg.nome = $env:PIX_NOME
            $cfg.cidade = $env:PIX_CIDADE
            Write-Host "Doação por Pix ativada"
          } else {
            Write-Host "::warning::Segredo PIX_KEY não configurado: a versão sai sem o botão de doação"
          }
          $cfg | ConvertTo-Json | Set-Content doacao.json -Encoding utf8NoBOM

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win nsis portable --publish never

      - name: Notas da versão a partir do CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Swipe Clean $version" }
          $notes += "`n`n---`n**Qual baixar?** ``SwipeClean-Setup`` instala com atalhos no menu Iniciar. ``SwipeClean-Portatil`` abre direto, sem instalar.`n`nNa primeira vez, o Windows pode mostrar ""O Windows protegeu o computador"": clique em **Mais informações → Executar assim mesmo**."
          Set-Content release-notes.md $notes -Encoding utf8NoBOM

      - name: Publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Swipe Clean ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/SwipeClean-Setup-*.exe
            dist/SwipeClean-Portatil-*.exe

      - name: Guardar build de teste
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: swipe-clean-teste
          path: dist/*.exe
          retention-days: 7
