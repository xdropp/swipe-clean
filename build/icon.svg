<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a44"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d9bff"/>
      <stop offset="1" stop-color="#5b67e6"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b86"/>
      <stop offset="1" stop-color="#e2405f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ff0ad"/>
      <stop offset="1" stop-color="#1fc884"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- carta da esquerda (remover) -->
  <g transform="rotate(-16 256 300)" filter="url(#sh)">
    <rect x="100" y="150" width="170" height="236" rx="28" fill="url(#red)"/>
  </g>
  <!-- carta da direita (manter) -->
  <g transform="rotate(16 256 300)" filter="url(#sh)">
    <rect x="242" y="150" width="170" height="236" rx="28" fill="url(#green)"/>
  </g>
  <!-- carta da frente -->
  <g filter="url(#sh)">
    <rect x="166" y="118" width="180" height="252" rx="30" fill="url(#front)"/>
    <rect x="196" y="152" width="120" height="78" rx="14" fill="#ffffff" fill-opacity=".9"/>
    <rect x="196" y="252" width="88" height="16" rx="8" fill="#ffffff" fill-opacity=".85"/>
    <rect x="196" y="282" width="120" height="12" rx="6" fill="#ffffff" fill-opacity=".45"/>
    <rect x="196" y="306" width="104" height="12" rx="6" fill="#ffffff" fill-opacity=".45"/>
  </g>
  <!-- setas de deslizar -->
  <path d="M108 428 h-34 m0 0 l16 -16 m-16 16 l16 16" stroke="#ff6b86" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M404 428 h34 m0 0 l-16 -16 m16 16 l-16 16" stroke="#4ff0ad" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
